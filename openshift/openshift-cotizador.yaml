apiVersion: apps/v1
kind: Deployment
metadata:
  name: cotizador-service
  labels:
    app: cotizador-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cotizador-service
  template:
    metadata:
      labels:
        app: cotizador-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: cotizador
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cotizador-service
spec:
  type: ClusterIP
  selector:
    app: cotizador-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cotizador-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cotizador-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
